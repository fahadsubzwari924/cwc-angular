@if (loadingService.isLoading()) {
  <div class="global-loader" role="status" aria-live="polite" aria-label="Loading">
    <div class="global-loader__backdrop"></div>
    <div class="global-loader__content">
      <div class="global-loader__spinner" aria-hidden="true"></div>
      @if (loadingService.message()) {
        <p class="global-loader__message">{{ loadingService.message() }}</p>
      }
    </div>
  </div>
}
