<div class="login-page">
  <div class="login-bg-gradient" aria-hidden="true"></div>
  <div class="login-bg-shapes" aria-hidden="true">
    <span class="login-shape login-shape--circle login-shape--1"></span>
    <span class="login-shape login-shape--circle login-shape--2"></span>
    <span class="login-shape login-shape--circle login-shape--3"></span>
    <span class="login-shape login-shape--square login-shape--4"></span>
    <span class="login-shape login-shape--square login-shape--5"></span>
    <span class="login-shape login-shape--circle login-shape--6"></span>
    <span class="login-shape login-shape--square login-shape--7"></span>
    <span class="login-shape login-shape--circle login-shape--8"></span>
    <span class="login-shape login-shape--ring login-shape--9"></span>
    <span class="login-shape login-shape--ring login-shape--10"></span>
  </div>
  <div class="login-card">
    <img src="assets/layout/images/cwc_logo.png" alt="Logo" class="login-logo" />
    <h1 class="login-title">Customize With Class</h1>
    <p class="login-subtitle">Sign in to your account</p>

    <form [formGroup]="loginForm" class="login-form">
      <div class="login-field">
        <label for="email" class="login-label">Email</label>
        <input
          formControlName="email"
          id="email"
          type="email"
          pInputText
          class="login-input w-full"
          placeholder="you@company.com"
          autocomplete="email"
        />
        @if (controls['email'].invalid && controls['email'].touched) {
          <small class="login-error">Enter a valid email address.</small>
        }
      </div>

      <div class="login-field">
        <label for="password" class="login-label">Password</label>
        <p-password
          formControlName="password"
          id="password"
          placeholder="••••••••"
          [toggleMask]="true"
          [feedback]="false"
          inputStyleClass="w-full login-input"
          styleClass="login-password w-full"
        />
        @if (controls['password'].invalid && controls['password'].touched) {
          <small class="login-error">Password is required.</small>
        }
      </div>

      <div class="login-options">
        <div class="login-remember">
          <p-checkbox [binary]="true" inputId="remember" styleClass="login-checkbox" />
          <label for="remember" class="login-remember-label">Remember me</label>
        </div>
      </div>

      <button
        pButton
        pRipple
        type="button"
        class="login-submit w-full"
        [disabled]="isLoading() || loginForm.invalid"
        (click)="login()"
      >
        @if (isLoading()) {
          <span class="login-submit-loading">
            <span class="login-submit-label">Signing in</span>
            <span class="login-submit-dots" aria-hidden="true">
              <span></span><span></span><span></span>
            </span>
          </span>
        } @else {
          Sign in
        }
      </button>
    </form>
  </div>
</div>
