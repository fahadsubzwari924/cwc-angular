<!-- Toolbar: search left | spacer | button right (consistent with products list) -->
<div class="grid">
  <div class="col-12 md:col-5 lg:col-5">
    <p-autoComplete
      placeholder="Search customer..."
      [dropdown]="true"
      [suggestions]="customerSuggestions()"
      [showClear]="true"
      (completeMethod)="searchCustomer($event)"
      (onSelect)="getSelectedCustomer($event)"
      (onClear)="onCustomerUnSelect()"
      field="fullName">
    </p-autoComplete>
  </div>
  <div class="col-12 md:col-5 lg:col-5" aria-hidden="true">
    <!-- Spacer -->
  </div>
  <div class="col-12 md:col-2 lg:col-2 flex justify-content-end">
    <p-button
      icon="pi pi-plus"
      label="Add Customer"
      styleClass="mb-2 p-button-sm w-full md:w-auto"
      (onClick)="openCreateCustomerModal()">
    </p-button>
  </div>
</div>
<div class="grid">
  <div class="col-12">

    @if (!isLoading()) {
      @if (customers()?.length) {
        <p-table [columns]="columns" [value]="customers()" [scrollable]="true" scrollHeight="flex">
          <ng-template pTemplate="header" let-columns>
            <tr>
              @for (col of columns; track col.field) {
                <th>{{ col.header }}</th>
              }
              <th>Actions</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-rowData let-columns="columns">
            <tr>
              @for (col of columns; track col.field) {
                <td>{{ rowData[col.field] }}</td>
              }
              <td>
                <p-button icon="pi pi-pencil" styleClass="p-button-text p-button-icon-only" (onClick)="openEditCustomerModal(rowData)"></p-button>
                <p-button icon="pi pi-trash" styleClass="p-button-text p-button-icon-only ml-2" (onClick)="onDelete(rowData)"></p-button>
              </td>
            </tr>
          </ng-template>

        </p-table>
        <p-paginator (onPageChange)="onPageChange($event)" [first]="startingRow()" [rows]="paginationConstants.PAGE_LIMIT"
          [totalRecords]="customerResponseMetadata()?.totalItems"></p-paginator>
      } @else {
        <div class="grid mt-3">
          <div class="col-12">
            <p class="text-center text-2xl">
              No Customer added yet!
            </p>
          </div>
        </div>
      }
    } @else {
      <div>
        <p-skeleton width="100%" height="12rem"></p-skeleton>
      </div>
    }
    <p-toast></p-toast>
  </div>
</div>
