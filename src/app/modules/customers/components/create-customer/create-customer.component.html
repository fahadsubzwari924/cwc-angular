@if (customerForm(); as form) {
  <form [formGroup]="form" class="create-customer-form p-fluid">
    <div class="formgrid grid">
      <div class="field col-12">
        <label for="fullName">Full Name <span class="required">*</span></label>
        <input pInputText formControlName="fullName" id="fullName" type="text" class="w-full" />
      </div>
      <div class="field col-12">
        <label for="address">Address <span class="required">*</span></label>
        <input pInputText formControlName="address" id="address" type="text" class="w-full" />
      </div>
      <div class="field col-12 md:col-6">
        <label for="country">Country <span class="required">*</span></label>
        <p-dropdown
          formControlName="country"
          inputId="country"
          [options]="countries"
          optionLabel="name"
          [filter]="true"
          filterBy="name"
          [showClear]="true"
          [autoDisplayFirst]="false"
          placeholder="Select country"
          styleClass="w-full"
        ></p-dropdown>
      </div>
      <div class="field col-12 md:col-6">
        <label for="province">Province <span class="required">*</span></label>
        <p-dropdown
          formControlName="province"
          inputId="province"
          [options]="provinces"
          optionLabel="name"
          [filter]="true"
          filterBy="name"
          [showClear]="true"
          [autoDisplayFirst]="false"
          placeholder="Select province"
          styleClass="w-full"
        ></p-dropdown>
      </div>
      <div class="field col-12">
        <label for="city">City <span class="required">*</span></label>
        <p-dropdown
          formControlName="city"
          inputId="city"
          [options]="cities()"
          optionLabel="name"
          [filter]="true"
          filterBy="name"
          [showClear]="true"
          [autoDisplayFirst]="false"
          placeholder="Select city"
          styleClass="w-full"
        ></p-dropdown>
      </div>
      <div class="field col-12 md:col-6">
        <label for="age">Age</label>
        <input pInputText formControlName="age" id="age" type="number" class="w-full" />
      </div>
      <div class="field col-12 md:col-6">
        <label for="contactNumber">Contact Number <span class="required">*</span></label>
        <input pInputText formControlName="contactNumber" id="contactNumber" type="text" class="w-full" />
      </div>
    </div>
    <div class="form-actions">
      <p-button label="Cancel" styleClass="p-button-secondary p-button-sm" (onClick)="close()"></p-button>
      <p-button
        label="Save"
        styleClass="p-button-sm"
        [disabled]="form.invalid"
        (onClick)="saveCustomer()"
      ></p-button>
    </div>
  </form>
}
