<form [formGroup]="orderSourceForm" class="p-fluid">
  <div class="formgrid grid">
    <div class="field col">
      <label requiredField>Name</label>
      <input formControlName="name" type="text"
        class="text-base text-color surface-overlay p-2 border-1 border-solid surface-border border-round appearance-none outline-none focus:border-primary w-full" />
    </div>
    <div class="field col">
      <label requiredField>Select Type</label>
      <p-dropdown formControlName="type" [options]="orderSourceTypes" [autoDisplayFirst]="false"
        optionLabel="name" optionValue="value"></p-dropdown>
    </div>
  </div>
  <div class="formgrid grid">
    <div class="field col">
      <label requiredField>Description</label>
      <textarea formControlName="description" rows="3" cols="30" pInputTextarea
        class="text-base text-color surface-overlay p-2 border-1 border-solid surface-border border-round appearance-none outline-none focus:border-primary w-full"></textarea>
    </div>
  </div>
</form>
<div class="flex justify-content-end gap-2 mt-3">
  <p-button label="Cancel" styleClass="p-button-secondary p-button-sm" (onClick)="close()"></p-button>
  <p-button label="Save" styleClass="p-button-sm" [disabled]="orderSourceForm.invalid"
    (onClick)="saveOrderSource()">
  </p-button>
</div>
