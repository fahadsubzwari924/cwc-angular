<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="card-content">
                <h3>Business Insights
                </h3>
                <div class="grid">
                    <div class="col-4">
                        <div class="flex flex-column gap-2">
                            <label>Select Category</label>
                            <p-multiSelect [options]="reportCategories()" [(ngModel)]="selectedReportCategories"
                                styleClass="w-full" optionLabel="name" optionValue="value" display="chip"
                                appendTo="body" [showClear]="true" (onChange)="getReportTypes()" />
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="flex flex-column gap-2">
                            <label>Select Report Type</label>
                            <p-multiSelect [options]="groupedReportTypeOptions()" [(ngModel)]="selectedReportTypes"
                                styleClass="w-full" [group]="true" optionGroupLabel="label"
                                optionGroupChildren="items" optionLabel="name" display="chip" appendTo="body"
                                [showClear]="true" (onChange)="onSelectReportType()" />
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="flex flex-column gap-2">
                            <label>Select Year</label>
                            <p-dropdown [(ngModel)]="selectedYear" [options]="yearOptions" optionLabel="name"
                                [showClear]="true" optionValue="value" [autoDisplayFirst]="false"
                                [disabled]="yearDisabled()" appendTo="body"></p-dropdown>
                        </div>
                    </div>
                </div>
                <div class="grid">
                    <div class="col-4">
                        <div class="flex flex-column gap-2">
                            <label>Select Date Range</label>
                            <p-datepicker styleClass="w-full" selectionMode="range" appendTo="body"
                                [(ngModel)]="selectedDateRange"></p-datepicker>
                        </div>
                    </div>
                    <div class="col-2 flex align-items-end">
                        <button pButton pRipple label="Apply" class="w-full" (click)="getReports()"
                            [disabled]="!yearDisabled && !selectedYear"></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="grid mt-5 reports-results-grid">
  @for (report of reports(); track report.chartId) {
    <div [ngClass]="report.cssClasses" class="reports-results-grid__cell">
      <div class="card report-chart-wrapper">
        <cwc-chart-host [reportData]="report"></cwc-chart-host>
      </div>
    </div>
  }
</div>
