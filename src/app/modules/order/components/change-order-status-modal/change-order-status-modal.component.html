<div class="grid">
  <div class="col">
    <div class="flex flex-column gap-2">
      <label>Select Status</label>
      <p-dropdown [(ngModel)]="selectedStatus" [options]="orderStatusOptions"
        optionLabel="name" appendTo="body"></p-dropdown>
    </div>
  </div>
</div>
<div class="flex justify-content-end gap-2 mt-3">
  <p-button label="Cancel" styleClass="p-button-secondary p-button-sm" (onClick)="close()"></p-button>
  <p-button label="Save" styleClass="p-button-sm" [disabled]="!selectedStatus"
    (onClick)="changeOrderStatus()">
  </p-button>
</div>
