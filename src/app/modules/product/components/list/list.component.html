<div class="products-page">

  <!-- Toolbar: search (4) + sort (3) left-aligned | spacer (3) | button (2) right-aligned -->
  <div class="grid products-toolbar">
    <div class="col-12 md:col-4">
      <p-autoComplete
        placeholder="Search products..."
        [dropdown]="false"
        [suggestions]="productSuggestions()"
        [showClear]="true"
        (completeMethod)="searchProduct($event)"
        (onSelect)="getSelectedProduct($event)"
        (onClear)="onProductUnSelect()"
        field="name">
      </p-autoComplete>
    </div>
    <div class="col-12 md:col-3">
      <p-dropdown
        [options]="sortOptions"
        placeholder="Sort By"
        optionLabel="label"
        optionValue="value"
        (onChange)="onSortChange($event)">
      </p-dropdown>
    </div>
    <div class="col-12 md:col-3" aria-hidden="true">
      <!-- Spacer: keeps button in last 2 cols so it aligns with product grid right edge -->
    </div>
    <div class="col-12 md:col-2 flex justify-content-end">
      <p-button icon="pi pi-plus" label="Add Product" styleClass="p-button-sm w-full md:w-auto"
      (onClick)="openCreateProductModal()"></p-button>
    </div>
  </div>

  <!-- Product Grid -->
  <div class="grid-container">
    @if (!isLoading() && products()?.length) {
      <div class="products-grid">
        @for (product of products(); track product.id) {
          <cwc-product-card [product]="product" (edit)="openEditProductModal($event)"
            (delete)="onDelete($event)">
          </cwc-product-card>
        }
      </div>

      <div class="pagination-section">
        <p-paginator (onPageChange)="onPageChange($event)" [first]="startingRow()"
          [rows]="paginationConstants.PRODUCT_LIST_PAGE_LIMIT"
          [totalRecords]="productResponseMetadata()?.totalItems ?? 0">
        </p-paginator>
      </div>
    } @else {
      <div class="products-grid">
        @for (item of [1,2,3,4,5,6]; track item) {
          <div class="skeleton-card">
            <p-skeleton [borderRadius]="'14px'" width="100%" height="220px" styleClass="mb-2"></p-skeleton>
            <p-skeleton width="70%" styleClass="mb-2"></p-skeleton>
            <p-skeleton width="45%"></p-skeleton>
          </div>
        }
      </div>
    }
  </div>

</div>

<p-toast></p-toast>
